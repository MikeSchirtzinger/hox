[package]
name = "hox-isolation"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
glob = "0.3"
hox-core = { path = "../hox-core" }
regex = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "process"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
